<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc" data-diagram-kind="solver-loop">
  <title id="title">constrained KKT QP and SQP solver mechanics</title>
  <desc id="desc">constrained solver loop from nonlinear objective and constraints through KKT conditions, QP subproblems, active-set/ADMM/interior-point/SQP solve states, warm starts, and release diagnostics.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="warn-arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="720" fill="#f8fafc"/>
  <rect x="42" y="38" width="1316" height="644" rx="18" fill="#ffffff" stroke="#d9e2ef" filter="url(#shadow)"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">constrained KKT, QP, and SQP solver mechanics</text>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">Feasible autonomy commands need primal variables, dual evidence, active constraints, deadline status, and fallback gates.</text>
  <rect x="80" y="144" width="1240" height="2" fill="#dbeafe"/>

  <!-- layout:solver-loop -->
  <rect x="90" y="205" width="205" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="192" y="236" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#1e3a8a">nonlinear problem</text>
  <text x="192" y="264" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">cost f(x)</text>
  <text x="192" y="287" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">g(x) &lt;= 0, h(x) = 0</text>
  <text x="192" y="310" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">bounds, slacks, units</text>

  <line x1="299" y1="265" x2="354" y2="265" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="365" y="205" width="210" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="470" y="236" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#14532d">KKT structure</text>
  <text x="470" y="263" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">stationarity</text>
  <text x="470" y="286" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">primal / dual feasibility</text>
  <text x="470" y="309" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">complementarity</text>

  <line x1="579" y1="265" x2="634" y2="265" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="645" y="205" width="210" height="120" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="750" y="236" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#9a3412">QP subproblem</text>
  <text x="750" y="263" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">0.5 x' P x + q' x</text>
  <text x="750" y="286" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">linearized constraints</text>
  <text x="750" y="309" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">active bounds and slacks</text>

  <line x1="859" y1="265" x2="914" y2="265" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="925" y="205" width="230" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1040" y="236" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#5b21b6">solver family</text>
  <text x="1040" y="263" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">active set / ADMM</text>
  <text x="1040" y="286" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">interior point / SQP</text>
  <text x="1040" y="309" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">factorization and tolerances</text>

  <line x1="1159" y1="265" x2="1209" y2="265" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1220" y="205" width="115" height="120" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="1278" y="244" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#155e75">primal</text>
  <text x="1278" y="266" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#155e75">plus dual</text>
  <text x="1278" y="296" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">x, lambda, nu</text>

  <path d="M1278 330 C1230 425 1106 472 986 455" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="835" y="395" width="290" height="125" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="980" y="428" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#3730a3">warm start and SQP loop</text>
  <text x="980" y="456" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">shift horizon, reuse duals</text>
  <text x="980" y="479" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">accept, shorten, or reject step</text>
  <text x="980" y="502" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">reset on mode or state jump</text>

  <path d="M835 455 C632 535 388 500 248 332" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="90" y="405" width="260" height="125" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="220" y="438" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#991b1b">release gates</text>
  <text x="220" y="466" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">status and deadline</text>
  <text x="220" y="489" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">max violation and slacks</text>
  <text x="220" y="512" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">fallback command</text>

  <path d="M365 265 C250 305 225 355 220 401" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#warn-arrow)"/>
  <path d="M1040 330 C1010 365 1010 372 1000 391" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <rect x="390" y="565" width="690" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="735" y="597" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Do not read "solved" as safe until original constraints, active multipliers, slacks, status, and timing are checked.</text>
</svg>
