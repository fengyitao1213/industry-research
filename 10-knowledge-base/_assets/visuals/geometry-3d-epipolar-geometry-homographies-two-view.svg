<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc" data-diagram-kind="projection-rays">
  <title id="title">two-view epipolar and homography verification</title>
  <desc id="desc">two-view verification diagram showing matched pixels, epipolar lines, fundamental and essential matrix routing, plane-induced homography, inlier masks, and degeneracy diagnostics.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="720" fill="#f8fafc"/>
  <rect x="42" y="38" width="1316" height="644" rx="18" fill="#ffffff" stroke="#d9e2ef" filter="url(#shadow)"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">two-view epipolar and homography verification</text>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">Matched pixels are routed through F/E epipolar checks, H planar checks, and degeneracy diagnostics before pose or map updates.</text>
  <rect x="80" y="144" width="1240" height="2" fill="#dbeafe"/>

  <!-- layout:projection-rays -->
  <rect x="90" y="180" width="300" height="330" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="130" y="225" width="220" height="210" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="130" y="225" width="220" height="210" fill="url(#grid)" opacity="0.65"/>
  <text x="240" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1e3a8a">image 1</text>
  <circle cx="185" cy="285" r="7" fill="#dc2626"/>
  <circle cx="260" cy="335" r="7" fill="#059669"/>
  <circle cx="305" cy="390" r="7" fill="#7c3aed"/>
  <line x1="130" y1="322" x2="350" y2="265" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="130" y1="370" x2="350" y2="330" stroke="#10b981" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="130" y1="415" x2="350" y2="372" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="240" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">features, timestamps, K, distortion</text>

  <rect x="1010" y="180" width="300" height="330" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <rect x="1050" y="225" width="220" height="210" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="1050" y="225" width="220" height="210" fill="url(#grid)" opacity="0.65"/>
  <text x="1160" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">image 2</text>
  <circle cx="1108" cy="298" r="7" fill="#dc2626"/>
  <circle cx="1182" cy="334" r="7" fill="#059669"/>
  <circle cx="1220" cy="386" r="7" fill="#7c3aed"/>
  <line x1="1050" y1="320" x2="1270" y2="260" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="1050" y1="360" x2="1270" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="1050" y1="415" x2="1270" y2="370" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1160" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">corresponding pixels and epilines</text>

  <path d="M350 285 C515 190 860 190 1058 298" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M350 335 C525 330 875 315 1175 334" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M350 390 C520 495 875 485 1212 386" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="462" y="204" width="210" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="567" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1e3a8a">F / E route</text>
  <text x="567" y="262" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">x2^T F x1 = 0</text>
  <text x="567" y="282" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">E = [t]x R after K^-1</text>

  <rect x="730" y="204" width="210" height="95" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="835" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#065f46">H route</text>
  <text x="835" y="262" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">x2 ~ H x1</text>
  <text x="835" y="282" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">plane or pure rotation</text>

  <rect x="474" y="356" width="450" height="114" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="699" y="388" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#9a3412">robust consensus and residual audit</text>
  <text x="699" y="416" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">RANSAC / USAC -> inlier mask -> residual quantiles</text>
  <text x="699" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">Sampson, symmetric epipolar, reprojection, transfer error</text>

  <rect x="160" y="555" width="230" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="275" y="584" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#991b1b">degeneracy flags</text>
  <text x="275" y="606" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">planar, low parallax, rolling shutter</text>

  <rect x="470" y="555" width="230" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="585" y="584" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#155e75">pose candidates</text>
  <text x="585" y="606" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">R, t direction, cheirality support</text>

  <rect x="780" y="555" width="230" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="895" y="584" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#5b21b6">planar hypothesis</text>
  <text x="895" y="606" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">plane support, normal, transfer error</text>

  <rect x="1090" y="555" width="230" height="70" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1205" y="584" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#0f172a">release evidence</text>
  <text x="1205" y="606" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">logs, masks, thresholds, model choice</text>

  <path d="M575 300 L605 356" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M825 300 L795 356" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M590 470 L585 555" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M700 470 L275 555" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M810 470 L895 555" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M924 430 C1080 448 1190 493 1205 555" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-blue)"/>
</svg>
