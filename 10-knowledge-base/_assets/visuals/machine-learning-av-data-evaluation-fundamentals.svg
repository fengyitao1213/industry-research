<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc" data-diagram-kind="benchmark-split-firewall">
  <title id="title">AV data evaluation split firewall</title>
  <desc id="desc">AV evaluation split firewall showing data sources, split manifests, scenario/ODD coverage, leakage gates, open-loop/pseudo/closed-loop benchmark ladder, and release evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="720" fill="#f8fafc"/>
  <rect x="42" y="38" width="1316" height="644" rx="20" fill="#ffffff" stroke="#d9e2ef" filter="url(#shadow)"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">AV data evaluation split firewall</text>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">AV evaluation split firewall showing data sources, split manifests, scenario/ODD coverage, leakage gates, open-loop/pseudo/closed-loop benchmark ladder, and release evidence.</text>
  <rect x="80" y="144" width="1240" height="2" fill="#dbeafe"/>

  <!-- layout:benchmark-split-firewall -->
  <rect x="92" y="196" width="205" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="194" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">data sources</text>
  <text x="194" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">logs, labels, sim, maps</text>

  <rect x="92" y="322" width="205" height="92" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="194" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">split manifest</text>
  <text x="194" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">route, time, site, rig</text>

  <rect x="92" y="448" width="205" height="92" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="194" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">scenario tags</text>
  <text x="194" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">ODD, actors, hazards</text>

  <rect x="388" y="186" width="84" height="384" rx="18" fill="#fee2e2" stroke="#e11d48" stroke-width="4"/>
  <text x="430" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#991b1b">leakage</text>
  <text x="430" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#991b1b">gates</text>
  <text x="430" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">no duplicate</text>
  <text x="430" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">clips, maps,</text>
  <text x="430" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">labels, tuning</text>

  <rect x="560" y="206" width="720" height="278" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="920" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">benchmark ladder</text>

  <rect x="590" y="276" width="130" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">open-loop</text>
  <text x="655" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">logged labels</text>

  <rect x="746" y="276" width="130" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="811" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">non-reactive</text>
  <text x="811" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">replay score</text>

  <rect x="902" y="276" width="130" height="70" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="967" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">pseudo-sim</text>
  <text x="967" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">synthetic views</text>

  <rect x="1058" y="276" width="130" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1123" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">closed-loop</text>
  <text x="1123" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">interactive</text>

  <rect x="668" y="382" width="176" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="756" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">sim agents</text>
  <text x="756" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">behavior realism</text>

  <rect x="936" y="382" width="176" height="62" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="1024" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">field evidence</text>
  <text x="1024" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">shadow, controlled site</text>

  <rect x="676" y="548" width="452" height="80" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="902" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#172033">release evidence</text>
  <text x="902" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">claim, ODD, split, metric config, model hash, per-scenario results, uncertainty</text>

  <line x1="298" y1="242" x2="384" y2="242" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="298" y1="368" x2="384" y2="368" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="298" y1="494" x2="384" y2="494" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="474" y1="330" x2="586" y2="330" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="720" y1="311" x2="742" y2="311" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="876" y1="311" x2="898" y2="311" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1032" y1="311" x2="1054" y2="311" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1123 348 C1120 486 1042 520 924 544" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M760 446 C800 510 842 528 890 544" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
