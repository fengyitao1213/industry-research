<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc" data-diagram-kind="measurement-chain">
  <title id="title">optical flow and scene flow measurement chain</title>
  <desc id="desc">motion-field measurement chain from paired images, depth, poses, and point clouds through correspondence, ego-motion compensation, optical flow, scene flow, occupancy flow, and release diagnostics.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="warn-arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="720" fill="#f8fafc"/>
  <rect x="42" y="38" width="1316" height="644" rx="18" fill="#ffffff" stroke="#d9e2ef" filter="url(#shadow)"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">optical flow and scene flow first principles</text>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">Motion fields move from pixel displacement to metric point and voxel velocity only after depth, pose, timing, and occlusion contracts are explicit.</text>
  <rect x="80" y="144" width="1240" height="2" fill="#dbeafe"/>

  <!-- layout:measurement-chain -->
  <rect x="85" y="196" width="200" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="112" y="225" width="70" height="58" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="112" y="225" width="70" height="58" fill="url(#grid)" opacity="0.7"/>
  <rect x="189" y="225" width="70" height="58" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="189" y="225" width="70" height="58" fill="url(#grid)" opacity="0.7"/>
  <path d="M137 257 C154 238 171 278 186 255" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="185" y="209" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#1e3a8a">paired images</text>
  <text x="185" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">pixels, K, exposure, dt</text>

  <rect x="85" y="390" width="200" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="128" cy="447" r="5" fill="#16a34a"/>
  <circle cx="166" cy="428" r="5" fill="#16a34a"/>
  <circle cx="203" cy="461" r="5" fill="#16a34a"/>
  <circle cx="238" cy="432" r="5" fill="#16a34a"/>
  <path d="M128 447 L166 428 L203 461 L238 432" fill="none" stroke="#14532d" stroke-width="2"/>
  <text x="185" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#14532d">point clouds</text>
  <text x="185" y="488" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">points, timestamps, ego pose</text>

  <line x1="288" y1="256" x2="340" y2="256" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="288" y1="450" x2="340" y2="450" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="350" y="196" width="210" height="120" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="455" y="231" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#155e75">correspondence</text>
  <text x="455" y="260" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">brightness constancy</text>
  <text x="455" y="282" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">features or learned cost</text>

  <rect x="350" y="390" width="210" height="120" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="455" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#854d0e">ego compensation</text>
  <text x="455" y="454" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">deskew, T(t->t+dt)</text>
  <text x="455" y="476" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">rigid flow baseline</text>

  <line x1="563" y1="256" x2="615" y2="256" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="563" y1="450" x2="615" y2="450" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="625" y="196" width="215" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="732" y="231" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#5b21b6">optical flow</text>
  <text x="732" y="258" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">(u, v) pixel displacement</text>
  <text x="732" y="281" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">sparse, dense, or learned</text>

  <rect x="625" y="390" width="215" height="120" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="732" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#9a3412">scene flow</text>
  <text x="732" y="452" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">(dx, dy, dz) metric motion</text>
  <text x="732" y="475" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">residual after ego motion</text>

  <path d="M732 318 L732 386" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="790" y="356" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">depth lift</text>

  <line x1="844" y1="450" x2="900" y2="450" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="910" y="390" width="210" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="1015" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#3730a3">occupancy flow</text>
  <text x="1015" y="452" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">voxel velocity field</text>
  <text x="1015" y="475" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">future occupancy input</text>

  <line x1="1124" y1="450" x2="1175" y2="450" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1185" y="355" width="145" height="190" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="1257" y="388" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#0f172a">release</text>
  <text x="1257" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#0f172a">diagnostics</text>
  <text x="1257" y="447" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">EPE / speed bins</text>
  <text x="1257" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">dynamic recall</text>
  <text x="1257" y="493" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">occlusion masks</text>
  <text x="1257" y="516" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">planner outcomes</text>

  <rect x="910" y="196" width="210" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1015" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#991b1b">failure gates</text>
  <text x="1015" y="257" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">occlusion, lighting, timing</text>
  <text x="1015" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#334155">depth and pose errors</text>

  <path d="M843 256 L906 256" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#warn-arrow)"/>
  <path d="M1015 316 L1015 386" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#warn-arrow)"/>

  <rect x="98" y="585" width="1180" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="688" y="616" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Flow is a measurement primitive: preserve frame, dt, masks, confidence, ego pose, calibration version, and consuming-module decision.</text>
</svg>
